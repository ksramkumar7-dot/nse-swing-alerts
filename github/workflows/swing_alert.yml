name: NSE Swing Master Auto Alerts

on:
  workflow_dispatch: # Lets you test anytime with 1 click!
  schedule:
    # 09:40 UTC = 3:10 PM IST (Mon-Fri) -> Pre-Close Live Capture Preview
    - cron: '40 9 * * 1-5'
    # 10:25 UTC = 3:55 PM IST (Mon-Fri) -> Final NSE Close & 4:00 PM Tomorrow's Buy Alert
    - cron: '25 10 * * 1-5'

jobs:
  run-swing-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Swing Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_master_330pm.py --now

      - name: Save CSV & HTML Watchlist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-watchlist-${{ github.run_number }}
          path: |
            *.csv
            *.html
          retention-days: 14
